# =============================================================================
# postgresql_oltp.conf - PostgreSQL Configuration for OLTP Benchmarks
#
# Created: June 2026
#
# PURPOSE:
#     Provide tuned PostgreSQL settings for OLTP workloads (Sysbench,
#     HammerDB TPROCC). Optimized for throughput, low latency, and
#     deterministic benchmark behavior.
#
# TARGET VERSION:
#     PostgreSQL 18.4 (see TAF/tests/setup_almalinux10.sh EXPECTED_PG_VERSION
#     and postgresql_default.conf for the full stock-default reference).
#
# USAGE:
#     Set taf.db_config_file=/path/to/this/file in your properties file,
#     or pass --property=taf.db_config_file=<path> on the command line.
#
# NOTES:
#     - TAF appends these settings to the postgresql.conf generated by initdb.
#     - Port and listen_addresses are always set by TAF; do not set them here.
#     - ssl settings are managed by TAF via db_ssl_mode; do not set ssl here.
#     - Adjust shared_buffers and effective_cache_size to match available RAM
#       on your test host (25% and 75% of RAM respectively are typical).
#     - synchronous_commit = off is safe for benchmarking; do NOT use in
#       production databases where durability is required.
# =============================================================================

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------
shared_buffers                 = 4GB
work_mem                       = 16MB
maintenance_work_mem           = 256MB
effective_cache_size           = 12GB
temp_buffers                   = 32MB

# ---------------------------------------------------------------------------
# WAL / Checkpointing
# ---------------------------------------------------------------------------
wal_buffers                    = 64MB
checkpoint_completion_target   = 0.9
checkpoint_timeout             = 15min
max_wal_size                   = 4GB
min_wal_size                   = 1GB
synchronous_commit             = off

# ---------------------------------------------------------------------------
# Parallelism
# ---------------------------------------------------------------------------
max_worker_processes           = 8
max_parallel_workers_per_gather = 0
max_parallel_workers           = 8

# ---------------------------------------------------------------------------
# I/O Workers (PostgreSQL 18+)
# io_workers raised above the stock default of 3: with up to 210 concurrent
# guests each issuing many prefetch/read requests (high effective_io_concurrency
# below), a small fixed worker pool becomes a bottleneck sooner than on a
# lightly-loaded server. io_method left at the 'worker' default rather than
# io_uring -- not universally available/enabled across the guest kernels in
# this pool, and 'worker' is the safe, portable choice for a mixed VM fleet.
# ---------------------------------------------------------------------------
io_method                      = worker
io_workers                     = 16

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
max_connections                = 600

# ---------------------------------------------------------------------------
# Planner
# ---------------------------------------------------------------------------
random_page_cost               = 1.1
effective_io_concurrency       = 200
default_statistics_target      = 100

# ---------------------------------------------------------------------------
# Logging (minimal for benchmarking)
# ---------------------------------------------------------------------------
log_min_duration_statement     = -1
log_connections                = off
log_disconnections             = off
log_checkpoints                = off
log_autovacuum_min_duration    = -1

# ---------------------------------------------------------------------------
# Autovacuum (enabled but low-priority during benchmark)
# ---------------------------------------------------------------------------
autovacuum                     = on
autovacuum_max_workers         = 3
autovacuum_naptime             = 1min
autovacuum_vacuum_cost_delay   = 20ms

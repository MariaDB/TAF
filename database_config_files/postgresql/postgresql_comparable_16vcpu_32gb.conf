# =============================================================================
# postgresql_comparable_16vcpu_32gb.conf - Cross-Engine-Comparable Tuning
# for PostgreSQL, sized for a 16 vCPU / 32GB RAM host
#
# Created: August 2026 -- scaled-up sibling of postgresql_comparable_4vcpu_16gb.conf
# RAM budget reduced from an initial 64GB draft to 32GB: August 2026
#
# PAIRS WITH: mariadb/mariadb_comparable_16vcpu_32gb.cnf
# SEE ALSO:   ../comparable-configuration.md (full analysis, sizing rules,
#             and the external OS/host conditions this file alone cannot
#             guarantee)
#
# SIZING MODEL for this file (same ratios as the 4vCPU/16GB tier, scaled up
# by the RAM factor 32GB/16GB = 2x, not 4x):
#     - shared_buffers = 25% of host RAM (8G of 32GB) -- same fraction as
#       the 4vCPU/16GB tier and the same fraction
#       mariadb_comparable_16vcpu_32gb.cnf uses for innodb_buffer_pool_size.
#     - effective_cache_size = 75% of host RAM (24GB of 32GB) -- same
#       shared_buffers/effective_cache_size ratio as the 4vCPU tier.
#     - max_wal_size kept at the same 1:4 ratio to shared_buffers (2GB for
#       8G), matching innodb_log_file_size = 2G on the MariaDB side.
#     - io_workers = 1x vCPU count (16 on 16 vCPUs), not the 2x ratio the
#       4vCPU tier uses -- same reasoning as the MariaDB sibling file: less
#       need to oversubscribe I/O concurrency past the core count once
#       there are 16 cores to begin with. This ratio is driven by vCPU
#       count, not RAM, so it is unchanged from the earlier 64GB draft of
#       this tier. Mirrors innodb_read_io_threads/write_io_threads = 16/16
#       by headline count.
#
# TARGET VERSION:
#     PostgreSQL 18.4 (see postgresql_default.conf for the full stock-
#     default reference and its provenance notes).
# =============================================================================

# ---------------------------------------------------------------------------
# Buffer pool -- the actual PG analog of innodb_buffer_pool_size
# (25% of 32GB host RAM)
# PG18 default: 128MB (NBuffers, src/backend/utils/misc/guc_tables.c).
# ---------------------------------------------------------------------------
shared_buffers                 = 8GB

# ---------------------------------------------------------------------------
# Planner cache-size hint (75% of 32GB host RAM)
# PG18 default: 4GB (DEFAULT_EFFECTIVE_CACHE_SIZE,
# src/include/optimizer/cost.h).
# ---------------------------------------------------------------------------
effective_cache_size           = 24GB

# ---------------------------------------------------------------------------
# WAL size that triggers a checkpoint (1:4 ratio to shared_buffers)
# PG18 default: 1GB. Matches innodb_log_file_size = 2G on the MariaDB side.
# ---------------------------------------------------------------------------
max_wal_size                   = 2GB

# ---------------------------------------------------------------------------
# I/O worker pool -- 1x vCPU count (16 on 16 vCPUs)
# PG18 default: 3. Mirrors MariaDB's 16+16 I/O threads by headline count.
# ---------------------------------------------------------------------------
io_workers                     = 16

# ---------------------------------------------------------------------------
# NOT changed here -- no PG equivalent exists (see comparable-configuration.md):
#   InnoDB's io_capacity/io_capacity_max rate limiter, or MariaDB's
#   thread_handling -- both are structural engine differences, not
#   tunable gaps.
# ---------------------------------------------------------------------------

# PURPOSE:
#     Minimal-necessary starting point, documenting every setting also tuned
#     by postgresql_oltp.conf / postgresql_analytics.conf / postgresql_minimal.conf.
#     Every line below is commented out and carries the upstream PostgreSQL
#     default value plus a link to the reference documentation, so a reviewer
#     can see at a glance what changes each of the other three profiles makes
#     relative to a stock server -- instead of having to look each one up.
#
# TARGET VERSION:
#     PostgreSQL 18.4 -- the current stable release (released 2026-05-14,
#     https://www.postgresql.org/docs/release/18.4/). TAF/tests/setup_almalinux10.sh
#     pins EXPECTED_PG_VERSION=18.4 and hard-fails setup if the installed
#     server doesn't match exactly, across all three --method installers
#     (percona / pgdg / appstream).
#     All default values and doc links below are for the PostgreSQL 18
#     documentation set (https://www.postgresql.org/docs/18/), not "current"
#     (which silently repoints at whatever the newest major version is once
#     PG19 ships) -- defaults do change between major versions, e.g.
#     effective_io_concurrency's default was 1 in PG16 but is 16 in PG18, and
#     log_connections changed from a boolean to a string-typed GUC.
#
# USAGE:
#     This is the default taf.db_config_file for sysbench_lua_pgsql.properties
#     (and hammerdb_tprocc_pgsql.properties) -- i.e. what a plain run_me.sh
#     invocation actually runs against, with every GUC left at its PG18.4
#     stock default. It contributes NO active settings of its own (every
#     line below is commented out); the only non-stock values a benchmark
#     run gets are the ones TAF forces regardless of db_config_file (port,
#     listen_addresses, ssl -- see NOTES below).
#     To run one of the tuned profiles instead, point taf.db_config_file at
#     postgresql_oltp.conf / postgresql_analytics.conf / postgresql_minimal.conf.
#     Diff this file against those to see exactly what each one overrides
#     and by how much relative to a stock server.
#
# NOTES:
#     - Port and listen_addresses are always set by TAF (postgres.pm
#       _db_apply_postgresql_conf); do not set them here -- any line
#       matching /^\s*(port|listen_addresses|ssl)\s*=/i is stripped from
#       whatever db_config_file is supplied before it's appended.
#     - ssl settings are managed by TAF via db_ssl_mode; do not set ssl here.
# =============================================================================

# ---------------------------------------------------------------------------
# "Mandatory" parameters -- i.e. ones without which the server would not
# start, or would start in a way unusable for a benchmark run.
#
# In practice, PostgreSQL has NO postgresql.conf setting that lacks a
# built-in default -- `initdb` generates a fully valid postgresql.conf with
# every parameter left at its compiled-in boot_val, and the server starts
# fine from that alone. Nothing below is a case of "no default exists"; it's
# listed here only because TAF's benchmark harness would be unusable (not
# because postgres itself would refuse to start) if left at the stock value:
#
#   - port             (PG default: 5432)      -- forced by TAF, not here.
#   - listen_addresses  (PG default: localhost) -- forced by TAF, not here.
#     Stock 'localhost' would block the TCP connections TAF/sysbench make
#     from the control host; TAF always overrides this to '*' regardless
#     of what (if anything) is set in this file.
#   - unix_socket_directories (PG default: /tmp on Linux) -- left at stock
#     default; not overridden anywhere in TAF. No action needed.
#
# No other setting in this file is "required" in the no-default sense the
# question implies. If you want to designate one of the tunables below as
# mandatory-with-no-safe-default for a *new* profile (e.g. shared_buffers
# sized to a specific host's RAM, so the compiled-in 128MB would be wrong
# for a benchmark), leave a TODO here and decide the value per-host:
#
#   TODO(you): any profile-specific "must be set explicitly" parameter goes here.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Memory
# Reference: https://www.postgresql.org/docs/18/runtime-config-resource.html
# ---------------------------------------------------------------------------
#shared_buffers                 = 128MB   # PG18 default
#work_mem                       = 4MB     # PG18 default
#maintenance_work_mem           = 64MB    # PG18 default
#temp_buffers                   = 8MB     # PG18 default

# ---------------------------------------------------------------------------
# WAL / Checkpointing
# Reference: https://www.postgresql.org/docs/18/runtime-config-wal.html
# ---------------------------------------------------------------------------
#wal_buffers                    = -1      # PG18 default: -1 = 1/32 of shared_buffers (min 64kB, max one WAL segment, typically 16MB)
#synchronous_commit             = on      # PG18 default
#checkpoint_completion_target   = 0.9     # PG18 default
#checkpoint_timeout             = 5min    # PG18 default
#max_wal_size                   = 1GB     # PG18 default
#min_wal_size                   = 80MB    # PG18 default

# ---------------------------------------------------------------------------
# Parallelism
# Reference: https://www.postgresql.org/docs/18/runtime-config-resource.html
# ---------------------------------------------------------------------------
#max_worker_processes            = 8      # PG18 default
#max_parallel_workers_per_gather = 2      # PG18 default
#max_parallel_workers            = 8      # PG18 default

# ---------------------------------------------------------------------------
# I/O Workers (PostgreSQL 18+ -- new async I/O subsystem)
# Reference: https://www.postgresql.org/docs/18/runtime-config-resource.html
#
# PG18 introduces io_method: reads (and on some platforms writes) can be
# issued asynchronously via a small pool of dedicated "IO worker" processes
# (io_method=worker, the default) instead of the backend blocking on each
# syscall itself. This is the direct answer to "how many IO threads/workers
# does a run use" now that we're on 18.4 -- in PG16 there was no such pool at
# all; effective_io_concurrency there was just an advisory prefetch depth,
# not an actual worker count.
# ---------------------------------------------------------------------------
#io_method                      = worker  # PG18 default (worker | sync | io_uring)
#io_workers                     = 3       # PG18 default -- number of IO worker processes (server-wide, not per-connection)
#io_combine_limit               = 128kB   # PG18 default -- largest single I/O size when combining adjacent block reads
#io_max_combine_limit           = 128kB   # PG18 default (platform-dependent ceiling for io_combine_limit; PGC_POSTMASTER)
#io_max_concurrency             = -1      # PG18 default -- auto-selected from shared_buffers/max processes, capped at 64

# ---------------------------------------------------------------------------
# Connections
# Reference: https://www.postgresql.org/docs/18/runtime-config-connection.html
# ---------------------------------------------------------------------------
#max_connections                = 100     # PG18 default (may be lower if the kernel can't support it, per initdb)

# ---------------------------------------------------------------------------
# Planner
# Reference: https://www.postgresql.org/docs/18/runtime-config-query.html
# Reference: https://www.postgresql.org/docs/18/runtime-config-resource.html (effective_io_concurrency)
# ---------------------------------------------------------------------------
#effective_cache_size           = 4GB     # PG18 default
#random_page_cost               = 4.0     # PG18 default
#effective_io_concurrency       = 16      # PG18 default -- CHANGED from PG16's default of 1 (raised as part of the async-I/O rework)
#default_statistics_target      = 100     # PG18 default
#parallel_setup_cost            = 1000    # PG18 default
#parallel_tuple_cost            = 0.1     # PG18 default
#min_parallel_table_scan_size   = 8MB     # PG18 default
#min_parallel_index_scan_size   = 512kB   # PG18 default
#enable_hashagg                 = on      # PG18 default
#enable_hashjoin                = on      # PG18 default
#enable_sort                    = on      # PG18 default

# ---------------------------------------------------------------------------
# JIT (PostgreSQL 11+)
# Reference: https://www.postgresql.org/docs/18/runtime-config-query.html
# ---------------------------------------------------------------------------
#jit                            = on      # PG18 default

# ---------------------------------------------------------------------------
# Logging
# Reference: https://www.postgresql.org/docs/18/runtime-config-logging.html
# ---------------------------------------------------------------------------
#log_min_duration_statement     = -1      # PG18 default (disabled)
#log_connections                = ''      # PG18 default -- CHANGED type: string GUC (connection-phase selector), not a boolean as in PG16; '' disables all connection logging
#log_disconnections             = off     # PG18 default
#log_checkpoints                = on      # PG18 default
#log_autovacuum_min_duration    = 10min   # PG18 default

# ---------------------------------------------------------------------------
# Autovacuum
# Reference: https://www.postgresql.org/docs/18/runtime-config-autovacuum.html
# ---------------------------------------------------------------------------
#autovacuum                     = on      # PG18 default
#autovacuum_max_workers         = 3       # PG18 default -- max autovacuum processes running concurrently
#autovacuum_worker_slots        = 16      # PG18 default -- reserved backend slots for autovacuum workers (PGC_POSTMASTER, separate pool from autovacuum_max_workers)
#autovacuum_naptime             = 1min    # PG18 default
#autovacuum_vacuum_cost_delay   = 2ms     # PG18 default

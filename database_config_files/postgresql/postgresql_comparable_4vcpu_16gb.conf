# =============================================================================
# postgresql_comparable_4vcpu_16gb.conf - Cross-Engine-Comparable Tuning for
# PostgreSQL, sized for a 4 vCPU / 16GB RAM host
#
# Created: July 2026 (as postgresql_minimum.conf)
# Renamed to postgresql_comparable.conf: August 2026
# Split into explicit vCPU/RAM-sized variants: August 2026
#
# PAIRS WITH: mariadb/mariadb_comparable_4vcpu_16gb.cnf
# SEE ALSO:   ../comparable-configuration.md (full analysis, sizing rules,
#             and the external OS/host conditions this file alone cannot
#             guarantee)
#
# SIZING MODEL for this file:
#     - shared_buffers = 25% of host RAM (4G of 16GB) -- the standard
#       PostgreSQL sizing heuristic, and deliberately the SAME fraction
#       mariadb_comparable_4vcpu_16gb.cnf uses for innodb_buffer_pool_size,
#       so both engines commit an identical fraction of host memory.
#     - effective_cache_size = 75% of host RAM (12GB of 16GB) -- the other
#       half of the same standard heuristic (shared_buffers 25% /
#       effective_cache_size 50-75%). This resolves the open question left
#       by the previous review pass: at 4G shared_buffers with no stated
#       host RAM, there was no principled way to say whether 4GB was also
#       the right planner hint or just a leftover default; pinning the
#       host to 16GB makes 12GB the defensible answer.
#     - max_wal_size kept at a 1:4 ratio to shared_buffers (1GB for 4G),
#       matching innodb_log_file_size = 1G on the MariaDB side.
#     - io_workers = 2x vCPU count (8 on 4 vCPUs), mirroring
#       innodb_read_io_threads/write_io_threads = 8/8 on the MariaDB side
#       by headline count -- not a structurally identical mechanism (see
#       comparable-configuration.md), but the closest available lever.
#
# TARGET VERSION:
#     PostgreSQL 18.4 (see postgresql_default.conf for the full stock-
#     default reference and its provenance notes).
# =============================================================================

# ---------------------------------------------------------------------------
# Buffer pool -- the actual PG analog of innodb_buffer_pool_size
# (25% of 16GB host RAM)
# PG18 default: 128MB (NBuffers, src/backend/utils/misc/guc_tables.c).
# ---------------------------------------------------------------------------
shared_buffers                 = 4GB

# ---------------------------------------------------------------------------
# Planner cache-size hint (75% of 16GB host RAM)
# PG18 default: 4GB (DEFAULT_EFFECTIVE_CACHE_SIZE,
# src/include/optimizer/cost.h). Allocates nothing; tells the planner how
# much data it should assume is cached across shared_buffers + OS page
# cache combined.
# ---------------------------------------------------------------------------
effective_cache_size           = 12GB

# ---------------------------------------------------------------------------
# WAL size that triggers a checkpoint (1:4 ratio to shared_buffers)
# PG18 default: 1GB. Matches innodb_log_file_size = 1G on the MariaDB side.
# ---------------------------------------------------------------------------
max_wal_size                   = 1GB

# ---------------------------------------------------------------------------
# I/O worker pool -- 2x vCPU count (8 on 4 vCPUs)
# PG18 default: 3. Mirrors MariaDB's 8+8 I/O threads by headline count.
# ---------------------------------------------------------------------------
io_workers                     = 8

# ---------------------------------------------------------------------------
# NOT changed here -- no PG equivalent exists (see comparable-configuration.md):
#   InnoDB's io_capacity/io_capacity_max rate limiter, or MariaDB's
#   thread_handling -- both are structural engine differences, not
#   tunable gaps.
# ---------------------------------------------------------------------------

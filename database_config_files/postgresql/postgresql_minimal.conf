# =============================================================================
# postgresql_minimal.conf - PostgreSQL Minimal Configuration for Development
#
# Created: June 2026
#
# PURPOSE:
#     Provide a minimal, resource-light PostgreSQL configuration for
#     development, functional testing, and low-load environments. Uses
#     conservative defaults that work on machines with limited RAM.
#
# TARGET VERSION:
#     PostgreSQL 18.4 (see TAF/tests/setup_almalinux10.sh EXPECTED_PG_VERSION
#     and postgresql_default.conf for the full stock-default reference).
#     No settings below changed default value between PG16 and PG18, so no
#     numeric changes were needed here -- this profile intentionally leaves
#     effective_io_concurrency/io_workers/io_method at their PG18 stock
#     defaults (16 / 3 / worker), matching its "minimal footprint" intent.
# =============================================================================

# ---------------------------------------------------------------------------
# Memory (conservative for dev/CI)
# ---------------------------------------------------------------------------
shared_buffers                 = 256MB
work_mem                       = 4MB
maintenance_work_mem           = 64MB
effective_cache_size           = 1GB

# ---------------------------------------------------------------------------
# WAL / Checkpointing
# ---------------------------------------------------------------------------
wal_buffers                    = 16MB
checkpoint_completion_target   = 0.9
checkpoint_timeout             = 5min
max_wal_size                   = 1GB
min_wal_size                   = 80MB

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
max_connections                = 200

# ---------------------------------------------------------------------------
# Parallelism (disabled for reproducibility in dev)
# ---------------------------------------------------------------------------
max_parallel_workers_per_gather = 0
max_parallel_workers           = 4

# ---------------------------------------------------------------------------
# Planner
# ---------------------------------------------------------------------------
random_page_cost               = 4.0
default_statistics_target      = 100

# ---------------------------------------------------------------------------
# Logging (informative for dev)
# ---------------------------------------------------------------------------
log_min_duration_statement     = 1000
log_connections                = off
log_disconnections             = off
log_checkpoints                = on

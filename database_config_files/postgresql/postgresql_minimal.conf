# =============================================================================
# postgresql_minimal.conf - PostgreSQL Minimal Configuration for Development
#
# Created: June 2026
#
# This file is part of the Test Automation Framework (TAF).
# Copyright (c) 2025-2026 MariaDB Foundation and Jonathan "jeb" Miller
#
# PURPOSE:
#     Provide a minimal, resource-light PostgreSQL configuration for
#     development, functional testing, and low-load environments. Uses
#     conservative defaults that work on machines with limited RAM.
# =============================================================================

# ---------------------------------------------------------------------------
# Memory (conservative for dev/CI)
# ---------------------------------------------------------------------------
shared_buffers                 = 256MB
work_mem                       = 4MB
maintenance_work_mem           = 64MB
effective_cache_size           = 1GB

# ---------------------------------------------------------------------------
# WAL / Checkpointing
# ---------------------------------------------------------------------------
wal_buffers                    = 16MB
checkpoint_completion_target   = 0.9
checkpoint_timeout             = 5min
max_wal_size                   = 1GB
min_wal_size                   = 80MB

# ---------------------------------------------------------------------------
# Connections
# ---------------------------------------------------------------------------
max_connections                = 200

# ---------------------------------------------------------------------------
# Parallelism (disabled for reproducibility in dev)
# ---------------------------------------------------------------------------
max_parallel_workers_per_gather = 0
max_parallel_workers           = 4

# ---------------------------------------------------------------------------
# Planner
# ---------------------------------------------------------------------------
random_page_cost               = 4.0
default_statistics_target      = 100

# ---------------------------------------------------------------------------
# Logging (informative for dev)
# ---------------------------------------------------------------------------
log_min_duration_statement     = 1000
log_connections                = off
log_disconnections             = off
log_checkpoints                = on

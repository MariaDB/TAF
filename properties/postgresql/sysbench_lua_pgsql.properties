#############################################################################
# sysbench_lua_pgsql.properties
#
# Created: June 2026
#
# This file is part of the Test Automation Framework (TAF).
#
# PURPOSE:
#     Example TAF properties file for running Sysbench OLTP benchmarks
#     against a PostgreSQL database managed by TAF.
#
# USAGE:
#     perl taf.pl --properties-file=properties/postgresql/sysbench_lua_pgsql.properties \
#                 --property=taf.action=init-start-db-run-tests
#
# NOTES:
#     - Set taf.db_software_install_packages to the path of your PostgreSQL
#       tarball or RPM packages before running.
#     - Adjust thread counts and duration to suit your test host.
#     - The default config uses postgresql_oltp.conf; swap for
#       postgresql_minimal.conf on low-resource machines.
#############################################################################

# ---------------------------------------------------------------------------
# TAF framework
# ---------------------------------------------------------------------------
taf.action                          = init-start-db-run-tests
taf.taf_db_makers_plugin            = postgres

# ---------------------------------------------------------------------------
# Database software install
# ---------------------------------------------------------------------------
# taf.db_software_install_packages  = /path/to/postgresql-18.tar.gz
taf.db_port                         = 5432

# ---------------------------------------------------------------------------
# Database configuration
# ---------------------------------------------------------------------------
taf.db_config_file                  = database_config_files/postgresql/postgresql_default.conf

# ---------------------------------------------------------------------------
# Test suite
# ---------------------------------------------------------------------------
taf.test_suite                      = sysbench-lua

# ---------------------------------------------------------------------------
# Sysbench driver
# ---------------------------------------------------------------------------
sysbench_lua.db_driver              = pgsql
sysbench_lua.connector              = libpq

# ---------------------------------------------------------------------------
# Workload
# ---------------------------------------------------------------------------
sysbench_lua.def_threads            = 8,16,32,64,128
sysbench_lua.def_duration           = 300
sysbench_lua.number_of_tables       = 8
sysbench_lua.number_of_rows         = 1000000
sysbench_lua.oltp_skip_trx          = on

# ---------------------------------------------------------------------------
# Tests to run (standard OLTP subset compatible with PostgreSQL)
# ---------------------------------------------------------------------------
taf.tests                           = OLTP_RO,OLTP_RW,UPDATE_KEY,UPDATE_NO_KEY,POINT_SELECT

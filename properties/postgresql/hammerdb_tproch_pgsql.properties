#############################################################################
# hammerdb_tproch_pgsql.properties
#
# Created: August 2026
#
# This file is part of the Test Automation Framework (TAF).
#
# PURPOSE:
#     Example TAF properties file for running HammerDB TPROC-H benchmarks
#     against a PostgreSQL database managed by TAF.
#
# USAGE:
#     perl taf.pl --properties-file=properties/postgresql/hammerdb_tproch_pgsql.properties \
#                 --property=taf.action=init-start-db-run-tests
#
# NOTES:
#     - Set taf.db_software_install_packages to your PostgreSQL package path.
#     - HammerDB must be installed separately; see hammerdb_tproch.hammerdb_dir.
#     - This is the first PostgreSQL TPROC-H properties file added to TAF —
#       the pg_tproch_* Tcl scripts under client_source/hammerdb exist, but
#       (unlike TPROC-C) this workload had no example config and no
#       functional-test coverage before this file was added.
#############################################################################

# ---------------------------------------------------------------------------
# TAF framework
# ---------------------------------------------------------------------------
taf.action                          = init-start-db-run-tests
taf.taf_db_makers_plugin            = postgres

# ---------------------------------------------------------------------------
# Database software install
# ---------------------------------------------------------------------------
# taf.db_software_install_packages  = /path/to/postgresql-18.tar.gz
taf.db_port                         = 5432

# ---------------------------------------------------------------------------
# Database configuration
# ---------------------------------------------------------------------------
taf.db_config_file                  = database_config_files/postgresql/postgresql_default.conf

# ---------------------------------------------------------------------------
# Test suite
# ---------------------------------------------------------------------------
taf.test_suite                      = hammerdb-tproch
taf.tests                           = TPROCH
taf.threads                         = 1

# ---------------------------------------------------------------------------
# HammerDB TPROC-H — PostgreSQL specific
# ---------------------------------------------------------------------------
hammerdb_tproch.db_type             = postgres
hammerdb_tproch.scale               = 1
hammerdb_tproch.total_querysets     = 1
hammerdb_tproch.checksum_after_setup = false
hammerdb_tproch.checksum_after_run   = false

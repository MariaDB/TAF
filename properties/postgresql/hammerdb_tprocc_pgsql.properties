#############################################################################
# hammerdb_tprocc_pgsql.properties
#
# Created: June 2026
#
# This file is part of the Test Automation Framework (TAF).
# Copyright (c) 2025-2026 MariaDB Foundation and Jonathan "jeb" Miller
#
# PURPOSE:
#     Example TAF properties file for running HammerDB TPC-C benchmarks
#     against a PostgreSQL database managed by TAF.
#
# USAGE:
#     perl taf.pl --properties-file=properties/postgresql/hammerdb_tprocc_pgsql.properties \
#                 --property=taf.action=init-start-db-run-tests
#
# NOTES:
#     - Set taf.db_software_install_packages to your PostgreSQL package path.
#     - HammerDB must be installed separately; set hammerdb_tprocc.hammerdb_dir.
#     - pg_storedprocs=true improves TPC-C performance on PostgreSQL.
#############################################################################

# ---------------------------------------------------------------------------
# TAF framework
# ---------------------------------------------------------------------------
taf.action                          = init-start-db-run-tests
taf.taf_db_makers_plugin            = postgres

# ---------------------------------------------------------------------------
# Database software install
# ---------------------------------------------------------------------------
# taf.db_software_install_packages  = /path/to/postgresql-16.tar.gz
taf.db_port                         = 5432

# ---------------------------------------------------------------------------
# Database configuration
# ---------------------------------------------------------------------------
taf.db_config_file                  = database_config_files/postgresql/postgresql_oltp.conf

# ---------------------------------------------------------------------------
# Test suite
# ---------------------------------------------------------------------------
taf.test_suite                      = hammerdb-tprocc

# ---------------------------------------------------------------------------
# HammerDB TPC-C — PostgreSQL specific
# ---------------------------------------------------------------------------
hammerdb_tprocc.db_type             = postgres
hammerdb_tprocc.warehouses          = 100

# PostgreSQL-specific TPC-C optimizations
hammerdb_tprocc.pg_storedprocs      = true
hammerdb_tprocc.pg_vacuum           = true
hammerdb_tprocc.pg_oracompat        = false
hammerdb_tprocc.pg_cituscompat      = false

# ---------------------------------------------------------------------------
# Workload
# ---------------------------------------------------------------------------
hammerdb_tprocc.def_threads         = 8,16,32,64
hammerdb_tprocc.def_duration        = 300
hammerdb_tprocc.rampup              = 2

[db_config_start]

[mysqld]
bind-address=127.0.0.1
# Core
max_connections=200
open_files_limit=65535
table_open_cache=4096
thread_cache_size=128
thread_handling=one-thread-per-connection

# In-memory workload
#innodb_buffer_pool_size=2G
innodb_buffer_pool_size=90G
innodb_log_file_size=512M
innodb_file_per_table=1
innodb_flush_method=O_DIRECT
innodb_flush_neighbors=0
innodb_doublewrite=0

# LRU management (MDEV-37992 reproduction)
#innodb_old_blocks_time=2147483647
innodb_old_blocks_time=1000
innodb_change_buffering=none
innodb_stats_auto_recalc=0

# AHI (default OFF unless testing)
innodb_adaptive_hash_index=OFF

# IO + flushing
innodb_io_capacity=200
innodb_io_capacity_max=200
innodb_adaptive_flushing=0

# Logging
log_bin=OFF
slow_query_log=OFF
general_log=OFF

# Query cache
query_cache_type=0
query_cache_size=0

# Performance schema
performance_schema=OFF

[db_config_end]

# Collect os stats during each iteration
taf.exec_script_file_before_run_iter=/home/jeb/taf-perl/scripts/collectors/taf_start_collectors.sh
taf.exec_script_file_after_run_iter=/home/jeb/taf-perl/scripts/collectors/taf_stop_collectors.sh


#############################################################################
# --- Profiling -----------------------------------------------------
#############################################################################

taf.profiler_enabled=false

taf.profiler_lib=taf-perf

# Delay profiling until after warmup
taf.profiler_start_delay=50

# Capture 30 seconds of stable workload
taf.profiler_duration=30

# Use seconds for duration units
taf.profiler_ts_duration_unit=sec

# Do not run continuous mode
taf.profiler_continuous=false

# Perf options: cpu-clock + call graph (frame pointer)
taf.profiler_opts=-F 999 -e cpu-clock:pp

# Generate human-readable perf report
taf.profiler_generate_report=true

# Generate flamegraph-compatible stack traces
taf.profiler_generate_flamegraph=true

#############################################################################
# TAF Main Props
#############################################################################

## Action TAF should perform.
# Run "perl taf.pl --list-actions" for the full list.
taf.action=init-start-db-run-tests

# Optional comment describing the purpose of this run.
taf.comments="MariaDB MDEV37992"

# Host on which the test is executed.
taf.host=localhost

#############################################################################
# TEST EXECUTION SETTINGS
#############################################################################

# Duration of the workload in seconds.
taf.duration=180

# Number of iterations to run for each thread count.
taf.iterations=1

# Name of the test suite to load.
taf.test_suite=sysbench-lua

# Classification of this run.
# Valid values: adhoc, investigation, production, rerun, release
taf.test_type=investigation

# Comma-separated list of test cases to execute.
taf.tests=POINTS-COVERED-PK

# Comma-separated list of thread counts to test.
taf.threads=40

# Include warmup like MDEV
taf.include_warmup_iteration=true

# Warmup duration in seconds.
taf.warmup_duration=120

# Number of warmup threads.
taf.warmup_threads=40

#############################################################################
# TIMING CONTROLS
#############################################################################

# Turns on CPU-based rest detection to watch DB process for rest.
taf.db_process_rest_enable=true

# CPU percent at or below this value counts as "rest".
taf.db_process_rest_low=6

# CPU percent at or above this value resets the rest counter (DB not idle).
taf.db_process_rest_high=20

#############################################################################
# REPORT GENERATION
#############################################################################

# Comma-separated list of report plugins to run after the test.
taf.report_plugin=taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm

#############################################################################
# DATABASE SETTINGS
#############################################################################

taf.db_clients_use_unix_socket=true

taf.db_engine=innodb

#############################################################################
# SYSBENCH-LUA SETTINGS
#############################################################################

# Which db driver
sysbench_lua.db_driver=mariadb


# Number of rows per table for sysbench workloads.
sysbench_lua.number_of_rows=10000000

# Number of tables to create for the workload.
sysbench_lua.number_of_tables=8

sysbench_lua.random_points_ranges=100

# Intermediate result reporting mode.
sysbench_lua.intermediate_result=2

#############################################################################
# SYSBENCH DEBUG SETTINGS
#############################################################################

# Enable verbose sysbench debugging output.
 sysbench_lua.debug_sysbench=false

#############################################################################
# TAF Debug
#############################################################################
taf.tools_debug=true
taf.verbose=true
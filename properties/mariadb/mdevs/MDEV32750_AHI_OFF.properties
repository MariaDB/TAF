#===============================================================================
# MariaDB Foundation - Test Automation Framework (TAF)
# MDEV-32750: Adaptive Hash Index (AHI) Regression Analysis
#
# Purpose:
#     Properties file used by TAF to execute deterministic HammerDB/TPROC-C
#     workloads for analyzing AHI ON/OFF behavior across MariaDB versions.
#
# Notes:
#     - This file is the canonical configuration; the AHI-ON/OFF variant differs
#       only in innodb_adaptive_hash_index and the taf.comments field.
#     - Designed for reproducible performance regression detection.
#
# Related:
#     https://jira.mariadb.org/browse/MDEV-32750
#===============================================================================

[db_config_start]
[mysqld]
bind-address=127.0.0.1
# Core
max_connections = 2000
thread_handling = pool-of-threads
event_scheduler = ON

# InnoDB core
innodb_buffer_pool_size = 64G
innodb_buffer_pool_instances = 1
innodb_buffer_pool_chunk_size = 128M
innodb_flush_method = O_DIRECT
innodb_flush_neighbors = 0
innodb_file_per_table = ON
innodb_checksum_algorithm = CRC32
innodb_adaptive_hash_index = 0

# Logging
innodb_log_file_size = 2G
innodb_log_buffer_size = 4G
innodb_flush_log_at_trx_commit = 1
sync_binlog = 1

# IO threads (fixed from their broken values)
innodb_read_io_threads = 24
innodb_write_io_threads = 24
innodb_io_capacity = 2000
innodb_io_capacity_max = 20000


# Table caches (dialed back for BP=1)
table_open_cache = 24000
table_open_cache_instances = 1
table_definition_cache = 24000

# Buffers (dialed back)
sort_buffer_size = 2M
read_buffer_size = 8M
read_rnd_buffer_size = 8M
join_buffer_size = 256K

# Performance schema (minimal)
performance_schema = ON
performance_schema_consumer_events_statements_current = ON
performance_schema_consumer_events_statements_history = OFF
performance_schema_consumer_events_statements_history_long = OFF

# Replication (if needed)
log_slave_updates = ON
slave_parallel_threads = 24
slave_parallel_mode = optimistic

# Binary logging
binlog_format = STATEMENT
binlog_checksum = NONE
binlog_cache_size = 512K
binlog_stmt_cache_size = 512K

# Query cache
query_cache_size = 0
query_cache_type = 0

# Optimizer (clean baseline)
optimizer_switch = index_merge=on,index_condition_pushdown=on,derived_merge=on,semijoin=on,materialization=on

[db_config_end]

hammerdb_tprocc.setup_virtual_user_count=25

taf.profiler_enabled=false
taf.profiler_lib=taf-perf

# Delay before profiling begins (warmup)
taf.profiler_start_delay=250

# Duration of profiling
taf.profiler_duration=30

# Interpret duration values as seconds
taf.profiler_ts_duration_unit=min

# Use duration mode (not continuous)
taf.profiler_continuous=false

# Perf options (your default is fine)
taf.profiler_opts=-a -e cpu-clock:pp

# Generate perf report
taf.profiler_generate_report=true

# Generate flamegraph data
taf.profiler_generate_flamegraph=true

taf.exec_sql_file_after_run_iter=/home/jeb/taf-perl/scripts/mariadb/mdevs/MDEV32750.sql

# Action TAF should perform.
taf.action=init-start-db-run-tests

# Report plugins (text, csv, json, chart_html)
taf.report_plugin=taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm

# Comment about why this run is being executed
taf.comments="MDEV-32750 AHI OFF"

#############################################################################
# TEST EXECUTION SETTINGS
#############################################################################

# Duration of TPROC-C run in minutes
taf.duration=10

# Number of iterations per thread count
taf.iterations=3

# Test suite to load
taf.test_suite=hammerdb-tprocc

# Test type (adhoc, investigation, production, rerun, release)
taf.test_type=investigation

# Test case from test suite (hammerdb-tprocc supports only tpcc)
taf.tests=tprocc

# Thread counts to run
taf.threads=8,16,24,32,48,64,96,128,256

# HammerDB warmup duration in minutes
taf.warmup_duration=1

#############################################################################
# TIMING CONTROLS
#############################################################################

# Turns on CPU-based rest detection for the DB process.
taf.db_process_rest_enable=true

# CPU percent at or below this value counts as "rest".
taf.db_process_rest_low=6

# CPU percent at or above this value resets the rest counter (DB not idle).
taf.db_process_rest_high=20

#############################################################################
# DATABASE SETTINGS
#############################################################################

taf.db_clients_use_unix_socket=true

#############################################################################
# HAMMERDB-TPROCC TEST SUITE SETTINGS
#############################################################################

# Number of warehouses to create and load
hammerdb_tprocc.number_of_warehouses=500

# Database type for TCL configuration
hammerdb_tprocc.db_type=maria

# Checksum after setup
hammerdb_tprocc.checksum_after_setup=true

# Checksum after each run
hammerdb_tprocc.checksum_after_run=true

# HammerDB reports per iteration
# Reports are found in iterations sub results directory

# JSON report options
hammerdb_tprocc.include_json_tcount=true
hammerdb_tprocc.include_json_timing=true
hammerdb_tprocc.include_json_result=true
hammerdb_tprocc.include_json_metrics=true

# HTML report options
hammerdb_tprocc.include_html_tcount=true
hammerdb_tprocc.include_html_timing=true
hammerdb_tprocc.include_html_result=true
hammerdb_tprocc.include_html_metrics=true

##### TAF Debug #####
taf.tools_debug=true
taf.verbose=true
# MAIN PROPERTIES

# Storage engine InnoDB?TidesDB
#taf.db_engine=Innodb
taf.db_engine=TidesDB
#taf.db_engine=RocksDB

taf.environment_variables=LD_LIBRARY_PATH;/data/tides_build_12.3.2_v9.3.10/tidesdb/lib64

# MariaDB config file InnoDB?TidesDB
#taf.db_config_file=./database_config_files/mariadb/innodb_compare.cnf
#taf.db_config_file=./database_config_files/mariadb/tides_compare.cnf
#taf.db_config_file=./database_config_files/mariadb/tides_compare_v3.cnf
#taf.db_config_file=./database_config_files/mariadb/tides_compare_mini.cnf
#taf.db_config_file=./database_config_files/mariadb/rocks_compare.cnf
#taf.db_config_file=./database_config_files/mariadb/rocks_compare_v2.cnf
#taf.db_config_file=./database_config_files/mariadb/rocks_compare_v3.cnf
#taf.db_config_file=./database_config_files/mariadb/rocks_compare_v4.cnf
#taf.db_config_file=./database_config_files/mariadb/rocks_compare_v5.cnf
#taf.db_config_file=./database_config_files/mariadb/rocks_compare_v6.cnf

sysbench_lua.oltp_dist_type=zipfian



# Ignore retry 1180
sysbench_lua.ignore_errors=1180,1020,1205,1213

# All tests start fresh
taf.test_setup_mode=per_test

#############################################################################
# TAF SETTINGS (GLOBAL)
#############################################################################

## Action: initialize DB, start server, run tests, stop server
taf.action=init-start-db-run-tests
#taf.action=run-tests

# Skip the running-DB-process check
taf.ignore_running_db_process=false

# Run description
taf.comments="tides"

# Host
taf.host=localhost

#############################################################################
# TEST EXECUTION SETTINGS
#############################################################################

# Duration per thread-count iteration (seconds)
taf.duration=240

# Number of iterations per thread count
taf.iterations=3

# Test suite
taf.test_suite=sysbench-lua

# Run type
taf.test_type=adhoc

sysbench_lua.use_bmk=false
sysbench_lua.bmk_update_range_size=64
sysbench_lua.oltp_index_updates=3

# Workloads to run
taf.tests=OLTP_RW,OLTP_WO_MODIFIABLE,UPDATE_KEY_TRANSACTIONAL_MODIFIABLE,UPDATE_NO_KEY,INSERT,DELETE


# Thread counts to sweep
taf.threads=8,16,32,64,128,256,512

# Warmup
taf.warmup_duration=200
taf.warmup_threads=128

#############################################################################
# TIMING CONTROLS
#############################################################################

taf.db_process_rest_enable=true
taf.db_process_rest_low=6
taf.db_process_rest_high=20

#############################################################################
# REPORT GENERATION
#############################################################################

taf.report_plugin=taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm

#############################################################################
# DATABASE SETTINGS
#############################################################################

# Connect via UNIX socket
taf.db_clients_use_unix_socket=true

# Database data directory
taf.db_data_dir=/data/data/

# MariaDB installation directory 
taf.db_software_install_dir=/data/tides_build/mariadb


#############################################################################
# SYSBENCH-LUA SETTINGS
#############################################################################

# MariaDB connector
sysbench_lua.db_driver=mariadb

# Table configuration
sysbench_lua.number_of_rows=1000000
sysbench_lua.number_of_tables=8

# Intermediate results (2 = detailed per-second output)
sysbench_lua.intermediate_result=2

#############################################################################
# SYSBENCH DEBUG
#############################################################################

sysbench_lua.debug_sysbench=false

# TAF debug
taf.tools_debug=true
taf.verbose=true

#############################################################################
# Three-way sysbench comparison -- TidesDB v10 (TideSQL 5.0.0) / InnoDB / RocksDB
#
# This file is part of the Test Automation Framework (TAF).
# Copyright (c) 2025-2026 MariaDB Foundation and Jonathan "jeb" Miller
# Licensed under the GNU General Public License, version 2 or later (GPLv2+).
#
# PURPOSE:
#     Run the same sysbench-lua OLTP workloads against MariaDB with each of the
#     three storage engines, one engine per run, then compare with
#     scripts/ResultsCompareRaw.pl. Toggle the engine and its matching config
#     together for each leg.
#
# BEFORE RUNNING (fill in the four environment paths marked FIXME below):
#     - taf.db_software_install_dir : a MariaDB install that has ha_tidesdb.so
#       (TideSQL 5.0.0), ha_rocksdb.so, and InnoDB.
#     - taf.db_data_dir             : scratch data directory.
#     - LD_LIBRARY_PATH in taf.environment_variables : the directory holding
#       libtidesdb.so.10 (e.g. /usr/local/lib).
#     - LD_PRELOAD in taf.environment_variables : path to libjemalloc.so.2.
#       REQUIRED when libtidesdb.so.10 was built against jemalloc (the installed
#       build is), because TAF starts mariadbd directly and the plugin will not
#       dlopen without jemalloc in the process image. Drop the LD_PRELOAD entry
#       if the library was built with the system allocator (verify with:
#       ldd <libdir>/libtidesdb.so.10 | grep jemalloc). It is harmless for the
#       InnoDB and RocksDB legs, so it can stay set for all three.
#
# USAGE (one-time client build, then a run per engine):
#     perl taf.pl --prop=./properties/mariadb/beta/sysbench_tidesdb10_innodb_rocks_compare.properties --action=setup-client
#     perl taf.pl --prop=./properties/mariadb/beta/sysbench_tidesdb10_innodb_rocks_compare.properties
#############################################################################

# MAIN PROPERTIES

# Storage engine -- uncomment exactly one, and its matching config below.
taf.db_engine=TidesDB
#taf.db_engine=InnoDB
#taf.db_engine=RocksDB

# Runtime environment. LD_LIBRARY_PATH resolves libtidesdb.so.10; LD_PRELOAD
# puts jemalloc in the image so the v10 plugin can load (see header).
# FIXME set the two paths for this host.
taf.environment_variables=LD_LIBRARY_PATH;/usr/local/lib,LD_PRELOAD;/lib/x86_64-linux-gnu/libjemalloc.so.2

# MariaDB config file -- uncomment the one matching the engine above.
taf.db_config_file=./database_config_files/mariadb/tides_compare_v10.cnf
#taf.db_config_file=./database_config_files/mariadb/innodb_compare.cnf
#taf.db_config_file=./database_config_files/mariadb/rocks_compare_v6.cnf

sysbench_lua.oltp_dist_type=zipfian

# TidesDB surfaces a first-committer-wins conflict as error 1180 at COMMIT.
# Ignoring it (plus the InnoDB/RocksDB lock-wait/deadlock codes) keeps the
# comparison fair across engines rather than aborting the tidesdb leg.
sysbench_lua.ignore_errors=1180,1020,1205,1213

# All tests start fresh
taf.test_setup_mode=per_test

#############################################################################
# TAF SETTINGS (GLOBAL)
#############################################################################

taf.action=init-start-db-run-tests
#taf.action=run-tests

taf.ignore_running_db_process=false
taf.comments="tidesdb10-vs-innodb-vs-rocksdb"
taf.host=localhost

#############################################################################
# TEST EXECUTION SETTINGS
#############################################################################

taf.duration=240
taf.iterations=3
taf.test_suite=sysbench-lua
taf.test_type=adhoc

sysbench_lua.use_bmk=false
sysbench_lua.bmk_update_range_size=64
sysbench_lua.oltp_index_updates=3

# Workloads to run
taf.tests=OLTP_RW,OLTP_WO_MODIFIABLE,UPDATE_KEY_TRANSACTIONAL_MODIFIABLE,UPDATE_NO_KEY,INSERT,DELETE

# Thread counts to sweep
taf.threads=8,16,32,64,128,256,512

# Warmup
taf.warmup_duration=200
taf.warmup_threads=128

#############################################################################
# TIMING CONTROLS
#############################################################################

taf.db_process_rest_enable=true
taf.db_process_rest_low=6
taf.db_process_rest_high=20

#############################################################################
# REPORT GENERATION
#############################################################################

taf.report_plugin=taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm

#############################################################################
# DATABASE SETTINGS
#############################################################################

taf.db_clients_use_unix_socket=true

# FIXME set the scratch data dir and the MariaDB install (with the three engines).
taf.db_data_dir=/data/data/
taf.db_software_install_dir=/data/tides_build/mariadb

#############################################################################
# SYSBENCH-LUA SETTINGS
#############################################################################

sysbench_lua.db_driver=mariadb
sysbench_lua.number_of_rows=1000000
sysbench_lua.number_of_tables=8
sysbench_lua.intermediate_result=2

#############################################################################
# SYSBENCH DEBUG
#############################################################################

sysbench_lua.debug_sysbench=false
taf.tools_debug=true
taf.verbose=true

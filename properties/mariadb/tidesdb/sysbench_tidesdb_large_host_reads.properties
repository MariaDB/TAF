# Change my path
taf.db_plugin_dir=/home/jeb/taf-perl/database_software_installs/MariaDB-server-11.4.13-1.el9.x86_64/lib64/mysql/plugin/

#############################################################################
# Database Configuration
#############################################################################
[db_config_start]

[mariadb]
bind-address=127.0.0.1
# Change my path
tidesdb_data_home_dir=/home/jeb/taf-perl/data/

plugin_maturity=unknown
plugin_load_add=ha_tidesdb
performance_schema=OFF
disable-log-bin
sync_binlog=0
general_log=OFF
slow_query_log=OFF
default_storage_engine=TidesDB
default_authentication_plugin=mysql_native_password
character_set_server=utf8mb4
collation_server=utf8mb4_general_ci
tls_version = TLSv1.2,TLSv1.3
max_connections=600
max_prepared_stmt_count=1000000
open_files_limit=65535
table_open_cache=4000
thread_cache_size=128

#transaction_isolation=REPEATABLE-READ
transaction_isolation=READ-COMMITTED

# sync
sync_master_info=0
sync_relay_log=0
sync_relay_log_info=0

aria_pagecache_buffer_size = 128M
aria_sort_buffer_size = 128M

tmp_table_size                 = 32M
max_heap_table_size            = 32M

plugin_maturity = unknown

plugin_load_add = ha_tidesdb.so

tidesdb_block_cache_size=60G
tidesdb_memtable_write_buffer_size=4G

tidesdb_memtable_sync_mode=NONE

tidesdb_default_compression=NONE

tidesdb_log_level=NONE
tidesdb_log_to_file=OFF

tidesdb_max_open_sstables=65536

tidesdb_flush_threads=4
tidesdb_compaction_threads=4

tidesdb_memtable_l0_queue_stall_threshold=30

tidesdb_default_l1_file_count_trigger=8
tidesdb_default_level_size_ratio=10
tidesdb_default_bloom_filter=ON

tidesdb_default_bloom_fpr=100

[db_config_end]

#############################################################################
# TAF SETTINGS (GLOBAL)
#############################################################################
## Action: initialize DB, start server, run tests, stop server
taf.action=init-start-db-run-tests

# Skip the running-DB-process check
taf.ignore_running_db_process=false

# Run description
taf.comments="Read Benchmark for TidesDB"

# Host
taf.host=localhost

#############################################################################
# TEST EXECUTION SETTINGS
#############################################################################
# Duration per thread-count iteration (seconds)
taf.duration=100

# Number of iterations per thread count
taf.iterations=3

# Test suite
taf.test_suite=sysbench-lua

# Run type
taf.test_type=adhoc

# Workloads to run
taf.tests=POINT_SELECT,OLTP_RO

# Thread counts to sweep
taf.threads=16,32,64

# Warmup
taf.warmup_duration=100
taf.warmup_threads=64

#############################################################################
# WATCH FOR DB REST TIMING CONTROLS
#############################################################################
# Enable
taf.db_process_rest_enable=true

# % cpu low count rest
taf.db_process_rest_low=6

# % cup high, reset rest counter
taf.db_process_rest_high=20

#############################################################################
# REPORT GENERATION
#############################################################################
# Report Plugins
taf.report_plugin=taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm

#############################################################################
# DATABASE SETTINGS
#############################################################################
# Storage engine
taf.db_engine=TidesDB

# Connect via UNIX socket
taf.db_clients_use_unix_socket=true

#############################################################################
# SYSBENCH-LUA SETTINGS
#############################################################################
# MariaDB connector
sysbench_lua.db_driver=mariadb

# Table configuration
sysbench_lua.number_of_rows=10000000
sysbench_lua.number_of_tables=8

# Intermediate results (2 = detailed per-second output)
sysbench_lua.intermediate_result=2

#############################################################################
# SYSBENCH DEBUG
#############################################################################
sysbench_lua.debug_sysbench=false

#############################################################################
# TAF debug
#############################################################################
taf.tools_debug=true
taf.verbose=true

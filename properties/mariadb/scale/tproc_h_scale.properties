#############################################################################
# Database Configuration for the MariaDB Server
#############################################################################
[db_config_start]

[mariadb]
bind-address                    = 127.0.0.1
server_id                       = 1

# --- Bin Log (InnoDB WAL Binlog - MariaDB 12.3+) ---
#disable_log_bin
log_bin                         = mariadb-bin
binlog_storage_engine           = innodb
binlog_format                   = ROW
max_binlog_size                 = 1G
binlog_expire_logs_seconds      = 86400

# --- Core & Cache ---
max_connections                 = 1024
open_files_limit                = 65535
table_open_cache                = 4096
table_definition_cache          = 4096
thread_cache_size               = 128

# --- Connections ---
thread_handling                 = one-thread-per-connection
#thread_handling                = pool-of-threads
#thread_pool_size               = 4

# --- In-Memory Workload & Redo Log ---
innodb_buffer_pool_size         = 96G
innodb_log_file_size            = 16G
innodb_log_buffer_size          = 128M

# --- Durability & Disk Flushing ---
innodb_flush_log_at_trx_commit  = 1
innodb_file_per_table           = 1
innodb_flush_neighbors          = 0

# --- AHI (Keep OFF for high-concurrency AMD EPYC) ---
innodb_adaptive_hash_index      = OFF

# --- NVMe Storage I/O Tuning ---
innodb_io_capacity              = 10000
innodb_io_capacity_max          = 25000
innodb_read_io_threads          = 16
innodb_write_io_threads         = 16
innodb_purge_threads            = 8
innodb_lru_scan_depth           = 2048

# --- Slow & General ---
slow_query_log                  = OFF
general_log                     = OFF

# --- Query Cache ---
query_cache_type                = 0
query_cache_size                = 0

# --- Performance Schema ---
performance_schema              = OFF

[db_config_end]

#############################################################################
# DATABASE SETTINGS
#
# These settings control how TAF connects to the database server for this run.
# Any value left commented out will fall back to:
#     1. TAF defaults
#     2. auto-populated values (special null handling)
#     3. command-line overrides
#############################################################################

# Where database tables/files go
# null means unset; TAF will resolve to defaults at runtime taf-perl/data
taf.db_data_dir=null

# Whether to connect using a UNIX socket instead of TCP.
# true  = use socket
# false = use TCP (default)
taf.db_clients_use_unix_socket=true

# Optional: override the storage engine.
# Default is taken from TAF or test suite defaults.
taf.db_engine=innodb

# Extra args to pass to database init/start
taf.db_extra_args=null

# Optional: directory where the database software has been unpacked.
# If omitted, TAF attempts to auto-detect the install directory.
#taf.db_software_install_dir=/home/taf-perl/database_software_installs/mariadb-12.3.0-linux-systemd-x86_64/

# Where database logs used for processing go (eg redo/undo)
# Note: default db_data_dir
# Note: None of current db plugins use. Here for expansion.
taf.db_trans_logs_dir=null

#############################################################################
# SSL
#############################################################################

# off | prefer | require | verify_ca | verify_identity
taf.db_ssl_mode=off
#taf.db_ssl_ca=/path/to/database_software_installs/.../ssl/ca.pem
#taf.db_ssl_cert=/path/to/database_software_installs/.../ssl/client-cert.pem
#taf.db_ssl_key=/path/to/database_software_installs/.../ssl/client-key.pem
#taf.db_ssl_linux_capath=/path/to/
#taf.db_use_native_for_passwords=false

#############################################################################
# CPU Affinity
#############################################################################

# CPU affinity for database engine
# null means unset; DB will run on all CPUs
# Valid forms:
#   0,1,2,3
#   0-11
#   (future) 0-3,8,10-12
taf.db_cpu_affinity=null

#############################################################################
# DB Reset Detection
#############################################################################

# Turns on CPU-based rest detection for the DB process.
taf.db_process_rest_enable=true

# CPU percent at or below this value counts as "rest".
taf.db_process_rest_low=6

# CPU percent at or above this value resets the rest counter (DB not idle).
taf.db_process_rest_high=20

#############################################################################
# TAF SETTINGS
#############################################################################

taf.action=init-start-db-run-tests

# Optional comment describing the purpose of this run.
taf.comments="MariaDB TPROC-H Scale Performance"

# Host on which the test is executed.
taf.host=localhost

#############################################################################
# TEST EXECUTION SETTINGS
#############################################################################

# Number of iterations to run.
taf.iterations=2

# Test suite to load.
taf.test_suite=hammerdb-tproch

# Classification of this run.
# Valid values: adhoc, investigation, production, rerun, release
taf.test_type=adhoc

# Test case from test suite (hammerdb-tproch supports only TPROCH).
taf.tests=TPROCH

# TPROC-H Power Test
# One HammerDB query stream executes the Q1-Q22 workload.
taf.threads=1

#############################################################################
# REPORT GENERATION
#############################################################################

# Comma-separated list of report plugins to run after the test.
# To report to TAF Back-end, include backend_reporter.pm
taf.report_plugin=taf_res_raw_text.pm,text.pm,chart_and_test_info_results_tables_html.pm

#############################################################################
# PROFILING
#############################################################################

taf.profiler_enabled=false
taf.profiler_lib=taf-perf

# Profiling duration in seconds.
taf.profiler_duration=30

taf.profiler_ts_duration_unit=sec
taf.profiler_continuous=false

# Perf options: cpu-clock + call graph.
taf.profiler_opts=-g --call-graph dwarf -F 199 -aR

taf.profiler_generate_report=true
taf.profiler_generate_flamegraph=true

#############################################################################
# HAMMERDB TPROC-H SETTINGS
#############################################################################

# Database type used when generating HammerDB TCL configuration.
hammerdb_tproch.db_type=maria

# Scale Factor
#
# IMPORTANT:
# TPROC-H results from different Scale Factors are not directly comparable.
# Hold Scale Factor constant when comparing CPU allocation, MariaDB versions,
# or server configuration changes.
#
# Small VM Tier 4-8 vCPU
hammerdb_tproch.scale=10
#hammerdb_tproch.scale=30
#hammerdb_tproch.scale=50

# Mid-Tier Server 24-36 vCPU
#hammerdb_tproch.scale=100
#hammerdb_tproch.scale=200
#hammerdb_tproch.scale=300

# High-End Server 48-96 vCPU
#hammerdb_tproch.scale=500
#hammerdb_tproch.scale=1000

# Number of querysets to run.
hammerdb_tproch.total_querysets=1

# Checksum after setup.
hammerdb_tproch.checksum_after_setup=true

# Checksum after each run.
hammerdb_tproch.checksum_after_run=true

# HammerDB reports are generated per iteration
# in the iteration sub-results directory.

# JSON reports.
hammerdb_tproch.include_json_result=true
hammerdb_tproch.include_json_metrics=true

# HTML reports.
hammerdb_tproch.include_html_result=true
hammerdb_tproch.include_html_metrics=true

#############################################################################
# TAF DEBUG
#############################################################################

taf.tools_debug=true
taf.verbose=true